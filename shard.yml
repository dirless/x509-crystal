name: x509-crystal
version: 0.2.0

description: |
  Pure Crystal X.509 certificate generation via OpenSSL (already a Crystal stdlib dependency).
  Generates self-signed and CA-signed certificates for mTLS and PKI use cases.
  Supports ECDSA P-256 and RSA with user-specified key sizes. No Go toolchain required.

authors:
  - Dirless <hello@dirless.io>

license: MIT

crystal: ">= 1.20.0"

main: src/x509.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
